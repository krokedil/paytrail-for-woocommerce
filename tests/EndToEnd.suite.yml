# EndToEnd suite configuration
#
# Browser-driven tests against the WordPress install BuiltInServerController boots, on
# WORDPRESS_URL. The ngrok tunnel NgrokController boots forwards to the same server and
# carries Paytrail's traffic only: see tests/_mu-plugins/02-paytrail-public-url.php.

actor: EndToEndTester
bootstrap: _bootstrap.php
modules:
  enabled:
    - lucatume\WPBrowser\Module\WPWebDriver
    - lucatume\WPBrowser\Module\WPDb
    - lucatume\WPBrowser\Module\WPFilesystem
    - lucatume\WPBrowser\Module\WPLoader
  config:
    lucatume\WPBrowser\Module\WPWebDriver:
      url: "%WORDPRESS_URL%"
      adminUsername: "%WORDPRESS_ADMIN_USER%"
      adminPassword: "%WORDPRESS_ADMIN_PASSWORD%"
      adminPath: "%WORDPRESS_ADMIN_PATH%"
      browser: chrome
      host: "%CHROMEDRIVER_HOST%"
      port: "%CHROMEDRIVER_PORT%"
      path: "/"
      window_size: 1920x1080
      wait: 10
      # Without this, a page load against a tunnel that has gone away sits there until
      # ChromeDriver's own 300s renderer timeout, once per test.
      pageload_timeout: 45
      restart: true
      capabilities:
        "goog:chromeOptions":
          args:
            - "--headless"
            - "--disable-gpu"
            - "--disable-dev-shm-usage"
            - "--proxy-server='direct://'"
            - "--proxy-bypass-list=*"
            - "--no-sandbox"
        "goog:loggingPrefs":
          browser: ALL
          performance: ALL
    lucatume\WPBrowser\Module\WPDb:
      dbUrl: "%WORDPRESS_DB_URL%"
      dump: "tests/Support/Data/dump.sql"
      populate: true
      cleanup: true
      reconnect: false
      url: "%WORDPRESS_URL%"
      urlReplacement: false
      tablePrefix: "%WORDPRESS_TABLE_PREFIX%"
    lucatume\WPBrowser\Module\WPFilesystem:
      wpRootFolder: "%WORDPRESS_ROOT_DIR%"
    lucatume\WPBrowser\Module\WPLoader:
      loadOnly: true
      wpRootFolder: "%WORDPRESS_ROOT_DIR%"
      dbUrl: "%WORDPRESS_DB_URL%"
      domain: "%WORDPRESS_DOMAIN%"
extensions:
  enabled:
    - lucatume\WPBrowser\Extension\ChromeDriverController
    - lucatume\WPBrowser\Extension\BuiltInServerController
    - Tests\Support\Extension\NgrokController
    - Qameta\Allure\Codeception\AllureCodeception
    - Tests\Support\Extension\ExampleNameReporter
    - Tests\Support\Extension\ArtifactReporter
    - Tests\Support\Extension\WordPressLogReporter
  config:
    Qameta\Allure\Codeception\AllureCodeception:
      outputDirectory: allure-results/endtoend
    lucatume\WPBrowser\Extension\ChromeDriverController:
      port: "%CHROMEDRIVER_PORT%"
    lucatume\WPBrowser\Extension\BuiltInServerController:
      # One worker serves one connection at a time, and a browser opens several per
      # host. At 5 workers the server stops answering a few tests in.
      workers: 24
      port: "%BUILTIN_SERVER_PORT%"
      docroot: "%WORDPRESS_ROOT_DIR%"
      env:
        DATABASE_TYPE: sqlite
        DB_ENGINE: sqlite
        DB_DIR: "%codecept_root_dir%/tests/_wordpress/data"
        DB_FILE: db.sqlite
        WORDPRESS_URL: "%WORDPRESS_URL%"
        # What Paytrail is told to call back on, used only by
        # tests/_mu-plugins/02-paytrail-public-url.php.
        PAYTRAIL_WORDPRESS_URL: "%PAYTRAIL_WORDPRESS_URL%"
        BUILTIN_SERVER_PORT: "%BUILTIN_SERVER_PORT%"
        WORDPRESS_ADMIN_PASSWORD: "%WORDPRESS_ADMIN_PASSWORD%"
    Tests\Support\Extension\WordPressLogReporter:
      wpRootFolder: "%WORDPRESS_ROOT_DIR%"
    Tests\Support\Extension\NgrokController:
      domain: "%NGROK_DOMAIN%"
      publicUrl: "https://%NGROK_DOMAIN%"
      # What Paytrail talks to, health checked before the suite and between tests: a
      # stalled agent keeps running while the traffic through it hangs.
      siteUrl: "%PAYTRAIL_WORDPRESS_URL%"
      authtoken: "%NGROK_AUTHTOKEN%"
      forwardPort: "%BUILTIN_SERVER_PORT%"
      waitForOnlineSeconds: 15
